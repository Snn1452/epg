name: update-tr
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  grab-tr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sites: [digiturk.com.tr, tvplus.com.tr, dsmart.com.tr, turksatkablo.com.tr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install

      - name: Grab ${{ matrix.sites }}
        run: npm run grab --- --sites=${{ matrix.sites }} --output=${{ matrix.sites }}.guide.xml --maxConnections=4 --gzip

      - name: Publish ${{ matrix.sites }} guide
        if: ${{ hashFiles(format('{0}.guide.xml*', matrix.sites)) != '' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ matrix.sites }}.guide.xml,${{ matrix.sites }}.guide.xml.gz"
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          makeLatest: true
          tag: 1.0.0
